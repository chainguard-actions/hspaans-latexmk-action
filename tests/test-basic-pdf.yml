name: Test basic PDF compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create tex file in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/main.tex" << 'EOF'
          \documentclass{article}
          \begin{document}
          Hello, World!
          \end{document}
          EOF
          echo "Created main.tex:"
          cat "$GITHUB_WORKSPACE/main.tex"
          ls -la "$GITHUB_WORKSPACE/"
      - id: action
        uses: .
        with:
          format: pdf
          filename: main.tex
      - name: Assert PDF was generated
        run: |
          echo "Workspace contents after action:"
          ls -la "$GITHUB_WORKSPACE/" || true
          if [ ! -f "$GITHUB_WORKSPACE/main.pdf" ]; then
            echo "FAIL: expected main.pdf to be generated"
            exit 1
          fi
          echo "PASS: main.pdf was generated"
