---
name: Test basic PDF compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture LaTeX file to workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/main.tex" "$GITHUB_WORKSPACE/main.tex"

      - name: Run latexmk action with default PDF format
        uses: .
        with:
          format: pdf
          filename: main.tex

      - name: Assert PDF was generated
        run: |
          echo "Checking for generated PDF..."
          ls -la "$GITHUB_WORKSPACE/"
          if [ ! -f "$GITHUB_WORKSPACE/main.pdf" ]; then
            echo "FAIL: expected main.pdf to be generated but it was not found"
            exit 1
          fi
          echo "PASS: main.pdf was successfully generated"
