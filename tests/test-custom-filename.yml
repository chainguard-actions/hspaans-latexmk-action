---
name: Test custom filename compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture LaTeX file to workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/article.tex" "$GITHUB_WORKSPACE/article.tex"

      - name: Run latexmk action with custom filename
        uses: .
        with:
          format: pdf
          filename: article.tex

      - name: Assert PDF was generated for custom filename
        run: |
          echo "Checking for generated PDF..."
          ls -la "$GITHUB_WORKSPACE/"
          if [ ! -f "$GITHUB_WORKSPACE/article.pdf" ]; then
            echo "FAIL: expected article.pdf to be generated but it was not found"
            exit 1
          fi
          echo "PASS: article.pdf was successfully generated from custom filename"
