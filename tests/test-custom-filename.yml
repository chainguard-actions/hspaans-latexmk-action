---
name: Test custom filename compilation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write LaTeX source file with custom name to workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/article.tex" << 'EOF'
          \documentclass{article}
          \title{Article Test Document}
          \author{Test Author}
          \date{\today}
          \begin{document}
          \maketitle
          Hello, World! This is an article test document for latexmk-action.
          \end{document}
          EOF
          echo "Created article.tex:"
          ls -la "$GITHUB_WORKSPACE/article.tex"

      - id: action
        uses: .
        with:
          format: pdf
          filename: article.tex

      - name: Assert PDF was generated for custom filename
        run: |
          echo "Checking for generated PDF..."
          ls -la "$GITHUB_WORKSPACE/" || true
          if [ ! -f "$GITHUB_WORKSPACE/article.pdf" ]; then
            echo "FAIL: expected article.pdf to be generated but it was not found"
            exit 1
          fi
          echo "PASS: article.pdf was generated successfully"
