---
name: Test PDF compilation with custom filename
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture LaTeX file to workspace root
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/report.tex" "$GITHUB_WORKSPACE/report.tex"

      - id: action
        uses: .
        with:
          format: pdf
          filename: report.tex

      - name: Assert PDF was generated for custom filename
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/report.pdf" ]; then
            echo "FAIL: expected report.pdf to be generated but it was not found"
            ls -la "$GITHUB_WORKSPACE/" || true
            exit 1
          fi
          echo "PASS: report.pdf was successfully generated"
          ls -lh "$GITHUB_WORKSPACE/report.pdf"
