---
name: Test invalid format fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write LaTeX source file to workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/main.tex" << 'EOF'
          \documentclass{article}
          \title{Test Document}
          \author{Test Author}
          \date{\today}
          \begin{document}
          \maketitle
          Hello, World! This is a test document for latexmk-action.
          \end{document}
          EOF
          echo "Created main.tex"

      - id: action
        uses: .
        with:
          format: dvi
          filename: main.tex
        continue-on-error: true

      - name: Assert action failed for invalid format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid format 'dvi' but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid format"
